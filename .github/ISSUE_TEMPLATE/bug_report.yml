name: Bug report
description: Something in the app, backend or marketplace does not work
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not attach real health data.** Synthetic recordings or redacted files are enough to reproduce almost anything.

        This is a 0.1.0-alpha build: known bugs are expected. Please include the details below so we can tell them apart from new ones.

  - type: input
    id: version
    attributes:
      label: eclipse health version
      placeholder: "0.1.0-alpha"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2 (22631)"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - ECG import
        - Health data import
        - Analysis / Cardia engine
        - Records, trends, reports
        - AI assistant
        - Modules / marketplace
        - External API
        - Settings, themes, layout
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import the attached synthetic WFDB record
        2. Open record detail
        3. Click "Re-analyse"
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste diagnostics from Settings → Diagnostics export, or backend output. Remove any personal data first.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      options:
        - label: I have removed personal health data, names and API keys from this report.
          required: true
