name: Feature request
description: Suggest a feature, module or integration
title: "[feat] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, consider whether this belongs in **core** or in a **module**. Device adapters, analysis engines, health domains, UI widgets, exporters and AI tools are all modules by design.

  - type: dropdown
    id: kind
    attributes:
      label: What kind of change is this?
      options:
        - New module (device, engine, health domain, widget, exporter, AI tool)
        - Core feature
        - UX / visual change
        - Developer experience / API
        - Documentation
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Describe the situation where the current behaviour is insufficient.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, related issues. Do not include personal health data.
    validations:
      required: false
