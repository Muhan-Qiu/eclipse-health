name: validate-module

on:
  pull_request:
    paths:
      - "marketplace/submissions/**"
      - "modules/community/**"
      - "schemas/module.schema.json"
      - ".github/scripts/validate_module.py"
      - ".github/workflows/validate-module.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-module-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate module submission
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Require module.json for submission changes
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="origin/${{ github.event.pull_request.base.ref }}"
          if git diff --name-only "$base...HEAD" | grep -q '^marketplace/submissions/'; then
            if ! find marketplace/submissions -name module.json -print -quit | grep -q .; then
              echo "::error::marketplace/submissions changed but no module.json was found"
              exit 1
            fi
          fi

      - name: Validate manifests, policy and packages
        env:
          GITHUB_ACTOR: ${{ github.event.pull_request.user.login || github.actor }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          OFFICIAL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'official') }}
        run: |
          set -euo pipefail
          args=(--all)
          if [ "${OFFICIAL_LABEL:-false}" = "true" ]; then
            args+=(--allow-official)
          fi
          python .github/scripts/validate_module.py "${args[@]}"

      - name: Upload built packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ehmod-ci
          path: dist-ci/
          if-no-files-found: ignore
          retention-days: 14
