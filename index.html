<!doctype html>
<html lang="zh-CN" data-palette="a">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="eclipse health · 本地优先的心电记录与分析" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F5F1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0C0F" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/icon-1024.png" />
    <!-- 首帧先铺近黑底：启动动画从黑开始，避免 WebView 在 CSS 加载前闪白 -->
    <style>
      html {
        background-color: #0a0c0f;
      }
    </style>
    <title>eclipse health</title>
    <script>
      // 在首帧前应用主题与配色，避免亮暗切换时的闪烁。
      (function () {
        try {
          var root = document.documentElement;
          var mode = localStorage.getItem("eh-theme") || "system";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
          var palette = localStorage.getItem("eh-palette");
          var palettes = ["a", "b", "c", "starry", "sunflower", "wave", "mist", "glaze"];
          var next = palettes.indexOf(palette) >= 0 ? palette : "a";
          root.dataset.palette = next;
          root.dataset.glass = next === "mist" || next === "glaze" ? "true" : "false";
          root.lang = localStorage.getItem("eh-locale") === "en-US" ? "en-US" : "zh-CN";
        } catch (e) {
          /* localStorage 不可用时退回默认值 */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
