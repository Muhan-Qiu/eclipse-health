<!doctype html>
<html lang="zh-CN" data-palette="a">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="eclipse health · 本地优先的心电记录与分析" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A0C0F'/%3E%3Ccircle cx='16' cy='16' r='10.5' fill='none' stroke='%23D8A657' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='%23101519'/%3E%3C/svg%3E"
    />
    <title>eclipse health</title>
    <script>
      // 在首帧前应用主题与配色，避免亮暗切换时的闪烁。
      (function () {
        try {
          var root = document.documentElement;
          var mode = localStorage.getItem("eh-theme") || "system";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
          var palette = localStorage.getItem("eh-palette");
          root.dataset.palette =
            palette === "b" || palette === "c" ? palette : "a";
          root.lang = localStorage.getItem("eh-locale") === "en-US" ? "en-US" : "zh-CN";
        } catch (e) {
          /* localStorage 不可用时退回默认值 */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
